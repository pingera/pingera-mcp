version: '3.8'

services:
  pingera-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pingera-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Transport mode
      - TRANSPORT_MODE=sse
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
      
      # Operation mode
      - MCP_MODE=read-write
      
      # Authentication (optional - see .env.docker for details)
      # In SSE mode, clients provide credentials via Authorization headers
      - PINGERA_API_KEY=${PINGERA_API_KEY:-}
      - PINGERA_JWT_TOKEN=${PINGERA_JWT_TOKEN:-}
      - REQUIRE_AUTH_HEADER=${REQUIRE_AUTH_HEADER:-true}
      
      # Optional: API configuration
      - PINGERA_BASE_URL=${PINGERA_BASE_URL:-https://api.pingera.ru/v1}
      - PINGERA_TIMEOUT=${PINGERA_TIMEOUT:-30}
      - PINGERA_MAX_RETRIES=${PINGERA_MAX_RETRIES:-3}
      
      # Optional: Uvicorn configuration
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Optional: SSL (if you have certificates)
      # - SSL_KEYFILE=/certs/key.pem
      # - SSL_CERTFILE=/certs/cert.pem
    
    # Optional: mount SSL certificates
    # volumes:
    #   - ./certs:/certs:ro
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
