[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pingera-mcp-server"
dynamic = ["version"]
description = "Model Context Protocol (MCP) server for the Pingera monitoring platform"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Pingera Team", email = "privet@pingera.ru"},
]
maintainers = [
    {name = "Pingera Team", email = "privet@pingera.ru"},
]
keywords = ["mcp", "monitoring", "pingera", "api", "statuspage", "playwright", "synthetic", "web monitoring", "uptime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pingera-sdk>=1.2.0,<2",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "starlette>=0.40",
    "urllib3>=2.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
pingera-mcp = "pingera_mcp.__main__:main"

[project.urls]
Homepage = "https://pingera.ru"
Documentation = "https://github.com/pingera/pingera-mcp#readme"
Repository = "https://github.com/pingera/pingera-mcp"
Issues = "https://github.com/pingera/pingera-mcp/issues"
Changelog = "https://github.com/pingera/pingera-mcp/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "pingera_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pingera_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "pingera_mcp/**/*.py",
    "tests/**/*.py",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    ".env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
